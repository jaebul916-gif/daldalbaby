# main 브랜치에 올리면 사이트를 빌드해서 GitHub Pages 에 배포해요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build static pages, sitemap.xml, robots.txt
        run: node build.mjs
        env:
          # 기본 주소는 site.config.json 의 siteUrl (https://daldalbaby.com).
          # 도메인 연결 전에 github.io 주소로 시험하려면 저장소 Variables 에 SITE_URL 을 넣으세요.
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
